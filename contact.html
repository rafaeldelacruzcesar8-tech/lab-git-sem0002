<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Aroma - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f9f6f0; color: #333;">

    <header style="background-color: #4a3525; color: white; padding: 20px; text-align: center;">
        <h1 style="margin: 0;">Café Aroma</h1>
        <nav style="margin-top: 10px;">
            <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Inicio</a>
            <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px;">Sobre Nosotros</a>
            <a href="contact.html" style="color: #ffcc00; text-decoration: none; margin: 0 15px; font-weight: bold;">Contacto</a>
        </nav>
    </header>

    <main style="padding: 40px; text-align: center;">
        <h2 style="color: #4a3525;">Contáctanos</h2>
        <p style="font-size: 18px; margin-bottom: 20px;">¿Tienes dudas o deseas hacer un pedido? Escríbenos.</p>
        <form style="display: inline-block; text-align: left; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
            <label style="display: block; margin-bottom: 5px;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;">
            
            <label style="display: block; margin-bottom: 5px;">Correo electrónico:</label>
            <input type="email" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;">
            
            <button type="submit" style="background-color: #4a3525; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px;">Enviar</button>
        </form>
    </main>

</body>
</html>
